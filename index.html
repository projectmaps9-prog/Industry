<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Haryana Industrial Survey Portal_view only</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #2563eb;
      --accent: #3b82f6;
      --light: #f8fafc;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Haryana Map Watermark */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url('https://upload.wikimedia.org/wikipedia/commons/4/4e/Haryana_map.svg') no-repeat center;
      background-size: 45%;
      opacity: 0.08;
      filter: brightness(200%) contrast(120%);
      z-index: 0;
    }

    /* Floating circles animation */
    .background-shapes span {
      position: absolute;
      display: block;
      width: 90px;
      height: 90px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      animation: float 10s infinite ease-in-out;
      filter: blur(6px);
    }
    .background-shapes span:nth-child(1) { top: 10%; left: 15%; animation-delay: 0s; }
    .background-shapes span:nth-child(2) { top: 70%; left: 70%; animation-delay: 3s; }
    .background-shapes span:nth-child(3) { top: 40%; left: 85%; animation-delay: 5s; }
    .background-shapes span:nth-child(4) { top: 80%; left: 20%; animation-delay: 2s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.7; }
      50% { transform: translateY(-30px) scale(1.2); opacity: 0.4; }
    }

    /* Container for login + collage */
    .container {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 50px;
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1200px;
      flex-wrap: wrap;
    }

    /* Login box */
    .login-box {
      position: relative;
      z-index: 1;
      width: 360px;
      max-width: 90%;
      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      color: var(--light);
      text-align: center;
      animation: fadeIn 1s ease;
      flex-shrink: 0;
    }

    .portal-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 15px auto;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--primary));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 32px;
      box-shadow: 0 4px 14px rgba(59,130,246,0.5);
    }

    h2 {
      font-size: 22px;
      margin: 10px 0 5px;
      font-weight: 700;
      color: #fff;
    }

    p {
      color: #dbeafe;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .input-group label {
      font-size: 13px;
      font-weight: 500;
      color: #e0e7ff;
      display: block;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.2);
      color: #fff;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .input-group input::placeholder { color: #d1d5db; }
    .input-group input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(255,255,255,0.25);
      box-shadow: 0 0 6px rgba(59,130,246,0.6);
    }

    .login-btn {
      width: 100%;
      padding: 12px 0;
      border: none;
      border-radius: var(--radius);
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(37,99,235,0.4);
    }

    .login-btn:hover {
      transform: scale(1.03);
      background: linear-gradient(90deg, var(--accent), var(--secondary));
      box-shadow: 0 6px 16px rgba(59,130,246,0.6);
    }

    .footer-text {
      margin-top: 15px;
      font-size: 12px;
      color: #cbd5e1;
    }

    /* Disclaimer */
    .disclaimer {
      width: 100%;
      max-width: 800px;
      background: #fffbcc;
      color: #663c00;
      border-left: 5px solid #ffcc00;
      padding: 12px 20px;
      margin-top: 40px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Industrial collage */
    .image-collage {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      perspective: 1000px;
      max-width: 450px;
      flex-shrink: 0;
    }

    .image-collage img {
      width: 210px;
      height: 210px;
      object-fit: cover;
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      transform: rotate(0deg) scale(1);
      animation: collageFloat 8s infinite ease-in-out alternate;
      position: relative;
      transition: all 0.3s ease;
    }

    .image-collage img:hover {
      transform: scale(1.1) rotate(0deg);
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      z-index: 10;
    }

    @keyframes collageFloat {
      0% { transform: translateY(0px) rotate(var(--rotate)) scale(1); opacity: 0.85; }
      50% { transform: translateY(-20px) rotate(var(--rotate)) scale(1.05); opacity: 0.65; }
      100% { transform: translateY(0px) rotate(var(--rotate)) scale(1); opacity: 0.85; }
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .container { flex-direction: column; gap: 40px; align-items: center; }
      .image-collage { width: 80%; max-width: 400px; }
      .image-collage img { width: 45%; height: 200px; }
    }

    @media (max-width: 480px) {
      .container { gap: 20px; }
      .image-collage { display: none; } /* Hide collage on mobile */
      .login-box { width: 90%; padding: 25px 18px; }
      h2 { font-size: 18px; }
      p { font-size: 12px; }
      .disclaimer { font-size: 12px; padding: 10px 15px; }
    }
  </style>
</head>
<body>
  <div class="background-shapes">
    <span></span><span></span><span></span><span></span>
  </div>

  <div class="container">
    <div class="login-box">
      <div class="portal-logo"><i class="fas fa-industry"></i></div>
      <h2>Haryana Industrial Survey Portal (For view only)</h2>
      <p>Access your district industrial survey dashboard</p>

      <form onsubmit="return loginUser(event)">
        <div class="input-group">
          <label for="username"><i class="fas fa-user"></i> Username</label>
          <input type="text" id="username" placeholder="Enter username" required>
        </div>
        <div class="input-group">
          <label for="password"><i class="fas fa-lock"></i> Password</label>
          <input type="password" id="password" placeholder="Enter password" required>
        </div>
        <button class="login-btn" type="submit">Login</button>
      </form>

      <div class="footer-text">© 2025 Haryana Industrial Survey Portal</div>
    </div>

    <div class="image-collage">
      <img src="data/1.jpg" alt="Industrial 1">
      <img src="data/3.jpg" alt="Industrial 3">
      <img src="data/4.jpg" alt="Industrial 4">
      <img src="data/5.jpg" alt="Industrial 5">
    </div>
  </div>

  <div class="disclaimer">
    ⚠️ This portal will not be used for legal purposes. It is only for viewing the data.
  </div>

  <script>
    const users = {
      admin: { password: "1234", access: "all" },
      faridabad: { password: "fd123", access: "faridabad" },
      panipat: { password: "pp123", access: "panipat" },
      yamunanagar: { password: "ynr123", access: "yamunanagar" },
      rohtak: { password: "rt123", access: "rohtak" }
    };

    function loginUser(event) {
      event.preventDefault();
      const user = document.getElementById("username").value.trim().toLowerCase();
      const pass = document.getElementById("password").value.trim();

      if (users[user] && users[user].password === pass) {
        sessionStorage.setItem("loggedIn", "true");
        sessionStorage.setItem("role", users[user].access);
        sessionStorage.setItem("username", user);
        window.location.href = "main.html";
      } else {
        alert("Invalid username or password. Please try again.");
      }
    }

    if (sessionStorage.getItem("loggedIn") === "true") {
      window.location.href = "main.html";
    }
  </script>
</body>
</html>
